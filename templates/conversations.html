<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Percakapan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Percakapan Terakhir</h2>
        <a class="btn btn-secondary" href="/">Kembali</a>
      </div>

      <div class="row">
        <div class="col-md-8">
          {% for c in conversations %}
          <div class="card card-custom mb-3 p-3">
            <div class="d-flex justify-content-between">
              <div><strong>{{ c.task }}</strong></div>
              <div class="muted small">{{ c.created_at }}</div>
            </div>
            <div class="mt-2">{{ c.response }}</div>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </body>
</html>
