<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My AI Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark py-3">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand logo" href="/">My AI Agent</a>
        <div class="d-flex gap-2 align-items-center">
          <input id="tokenInput" class="form-control form-control-sm" style="width:220px" placeholder="API token (optional)" />
          <button id="saveToken" class="btn btn-sm btn-outline-light">Simpan</button>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <div class="row g-4">
        <div class="col-md-6">
          <div class="card card-custom p-4">
            <h5>Berikan Tugas</h5>
            <form id="taskForm" class="mt-3">
              <div class="mb-3">
                <input class="form-control task-input" id="task" placeholder="Tulis tugas singkat..." />
              </div>
              <div class="d-flex gap-2">
                <button class="btn btn-primary" id="sendBtn">Kirim</button>
                <a class="btn btn-outline-light" href="/conversations">Lihat Percakapan</a>
              </div>
            </form>
            <div class="mt-3 result-box" id="result">Hasil akan muncul di sini.</div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card card-custom p-4">
            <h5>Terakhir</h5>
            <ul class="list-group list-group-flush mt-3" id="recentList">
              <li class="list-group-item bg-transparent muted">Memuat...</li>
            </ul>
          </div>
        </div>
      </div>
    </main>

    <footer class="text-center py-4 muted">&copy; My AI Agent</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      async function loadRecent(){
        try{
          const res = await fetch('/api/conversations');
          if(!res.ok) throw 0;
          const data = await res.json();
          const ul = document.getElementById('recentList');
          ul.innerHTML='';
          data.forEach(c=>{
            const li = document.createElement('li');
            li.className='list-group-item bg-transparent';
            li.innerHTML = `<div class="fw-bold">${c.task}</div><div class="muted small">${c.created_at}</div><div class="mt-1">${c.response}</div>`;
            ul.appendChild(li);
          });
        }catch(e){
          document.getElementById('recentList').innerHTML='<li class="list-group-item bg-transparent muted">Tidak bisa memuat.</li>'
        }
      }

      document.getElementById('saveToken').addEventListener('click', (e)=>{
        const t = document.getElementById('tokenInput').value.trim();
        if(t) localStorage.setItem('agent_token', t); else localStorage.removeItem('agent_token');
        alert('Token disimpan di browser.');
      });

      document.getElementById('taskForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const task = document.getElementById('task').value;
        const headers = {'Content-Type':'application/json'};
        const token = localStorage.getItem('agent_token');
        if(token) headers['Authorization'] = 'Bearer '+token;
        const res = await fetch('/api/run', {method:'POST', headers, body: JSON.stringify({task})});
        const json = await res.json();
        if(res.status === 401){
          document.getElementById('result').textContent = 'Unauthorized — periksa token Anda.';
        } else {
          document.getElementById('result').textContent = json.result || JSON.stringify(json);
        }
        document.getElementById('task').value='';
        loadRecent();
      });

      // populate token input from localStorage
      const saved = localStorage.getItem('agent_token');
      if(saved) document.getElementById('tokenInput').value = saved;
      loadRecent();
    </script>
  </body>
</html>
